[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottleneck-os"
version = "0.1.0"
description = "Evidence-backed radar for AI infrastructure bottlenecks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Bottleneck OS contributors" }
]
dependencies = []

[project.optional-dependencies]
llm = [
  "openai>=1.0",
  "anthropic>=0.25",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["bottleneck_os*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# scripts/*.py insert the repo root onto sys.path before importing bottleneck_os,
# since they're run directly (`py scripts/foo.py`) rather than through the
# installed package.
"scripts/*.py" = ["E402"]
